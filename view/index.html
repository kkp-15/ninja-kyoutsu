<!-- OBS 表示ページ。広告・GA4 なし。枠・背景（クリーム／緑／透過）・待ち画面・クレジットは kit の k-view。
     操作ページ（同じブラウザ）から KKit.live で今の場面だけ受け取る。
     字は kit の --k-v-*（どのウィンドウでも 1/3 に縮めて 14px 以上）。大きさは幅1600で組んだ値を cqw にしたもの。
     話しながら探すは帯だけ。背景を「緑」にすると帯のまわりを OBS の「クロマキー」で抜ける（前の版は緑に決め打ちだった）。 -->
<style>
[hidden]{display:none!important}
.ky-ttl{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ky-meta{flex:none;display:flex;align-items:center;gap:max(12px,1.4cqw);white-space:nowrap;font-variant-numeric:tabular-nums}
.band-l{display:inline-block;padding:.05em .6em;background:var(--k-sumi);color:#fff;font-family:var(--k-bold);font-weight:400;transform:skewX(-8deg)}
.band-l.on{background:var(--k-shu)}
.k-view-body{padding-top:max(8px,.8cqw)}
.pack{font-size:var(--k-v-min);font-weight:800;color:var(--k-text-2);line-height:1.2;margin-bottom:max(4px,.4cqw)}
.q{font-family:var(--k-bold);font-size:max(42px,calc(max(62px,4.75cqw)*var(--f,1)));line-height:1.2;letter-spacing:.03em;word-break:auto-phrase;text-wrap:balance}
.q.sm{font-size:max(42px,calc(max(46px,3.4cqw)*var(--f,1)))}
.choices{display:flex;flex-wrap:wrap;gap:max(10px,1cqw);margin-top:max(12px,1.6cqw)}
.choices .k-tag{margin:0;padding:.1em .55em;border-width:max(2px,.19cqw);border-radius:max(6px,.5cqw);font-size:var(--k-v-min);font-weight:800;line-height:1.3;letter-spacing:.02em}
.players{display:grid;gap:max(10px,1cqw);margin-top:max(12px,1.6cqw)}
.players.open{flex:1;min-height:0;margin-top:max(10px,1.2cqw)}
.pl{position:relative;display:flex;flex-direction:column;justify-content:center;padding:max(6px,.9cqw) max(10px,1.4cqw);border:max(2px,.19cqw) solid var(--k-sumi);border-radius:max(6px,.5cqw);min-width:0;min-height:0;overflow:hidden}
.pl .nm{display:block;font-size:var(--k-v-min);font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .st{display:block;font-family:var(--k-bold);font-size:var(--k-v-min);line-height:1.2;color:var(--k-text-2)}
.pl.done .st{color:var(--k-shu)}
.pl .an{display:block;font-family:var(--k-bold);line-height:1.12;word-break:auto-phrase}
.pl.hit{border-color:var(--k-shu);border-width:max(4px,.44cqw);padding:max(4px,.65cqw) max(8px,1.1cqw)}
.pl.hit .an{color:var(--k-shu)}
.verdict{display:flex;align-items:center;gap:max(14px,1.75cqw);margin-top:max(8px,1.1cqw);font-size:var(--k-v-s);line-height:1.25;font-weight:800;min-height:max(84px,8cqw)}
.verdict .k-stamp{flex:0 0 auto;width:max(84px,8cqw);height:max(84px,8cqw);font-size:var(--k-v-min);line-height:1.05;text-align:center}
.rare{flex:none;display:inline-block;margin-right:max(8px,1cqw);padding:0 .35em;border:max(3px,.25cqw) solid var(--k-shu);border-radius:max(4px,.4cqw);color:var(--k-shu);font-family:var(--k-bold);font-weight:400}
.verdict .tx{min-width:0;line-height:1.32;padding-bottom:.04em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.follow{margin-top:max(4px,.5cqw);font-size:var(--k-v-min);font-weight:800;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.follow span,.ask span{margin-right:max(8px,1cqw);color:var(--k-text-2)}
.ask{margin:max(12px,1.5cqw) 0 0;padding:max(8px,.9cqw) 0 0;border-top:max(2px,.12cqw) solid var(--k-line-soft);font-size:var(--k-v-min);font-weight:800;line-height:1.3}
.ask b{color:var(--k-shu)}
.big{margin:max(8px,1.2cqw) 0 0;font-family:var(--k-head);font-weight:800;font-size:max(42px,calc(max(76px,6.9cqw)*var(--f,1)));letter-spacing:.04em;line-height:1.15;word-break:auto-phrase}
.names{margin:max(12px,1.6cqw) 0 0;font-family:var(--k-bold);font-size:var(--k-v-m);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res{display:flex;gap:max(20px,3cqw);align-items:center;flex:1;min-height:0}
.res .k-result{flex:0 0 35%;box-sizing:border-box;border-width:max(14px,1.4cqw) max(36px,3.2cqw);border-image-width:max(14px,1.4cqw) max(36px,3.2cqw);padding:max(4px,.6cqw) 0}
.res .k-result small{font-size:var(--k-v-min);line-height:1.25}
.res .k-result b{font-size:max(42px,calc(max(84px,6.9cqw)*var(--f,1)));line-height:1.1}
.res .best{flex:1;min-width:0}
.res .best small{display:block;font-size:var(--k-v-min);font-weight:800;color:var(--k-text-2)}
.res .best b{display:block;margin-top:max(4px,.5cqw);font-family:var(--k-bold);font-weight:400;font-size:max(42px,calc(max(62px,5.25cqw)*var(--f,1)));line-height:1.15;color:var(--k-shu);word-break:auto-phrase;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.res .best span{display:block;margin-top:max(6px,.75cqw);font-size:var(--k-v-min);font-weight:800;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.res ul{flex:1;margin:0;padding:0;list-style:none;font-size:var(--k-v-min);font-weight:800;line-height:1.3;min-width:0}
.res li{padding:max(4px,.6cqw) 0;border-bottom:max(2px,.12cqw) solid var(--k-line-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#tst span.t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 小さいウィンドウ（--k-v-* が 42px で止まるので字が相対的に大きくなる）：補助の行を畳む */
@container (max-width:1100px){
  .pack,.follow,.ky-meta .qn-all{display:none}

  .tp .f{display:none}
  .res .k-result{flex-basis:44%}

  .is-q .q{font-size:var(--k-v-s)}
  .is-q .pl{flex-direction:row;align-items:baseline;justify-content:space-between;gap:max(8px,1cqw);padding:max(4px,.5cqw) max(8px,1cqw)}
  .is-q .pl .nm{flex:1 1 auto;min-width:0}
  .is-q .pl .st{flex:none}
  .is-q.n5 .ask{display:none}
  /* オープン：判子は右上へ（判定の文は札の赤いふちで見える） */
  .qrow{display:flex;align-items:center;gap:max(8px,1cqw)}
  .qrow .q{flex:1 1 auto;min-width:0}
  .qrow .verdict{flex:none;margin:0;min-height:0;gap:max(8px,1cqw)}

  .is-open .pl{padding:max(3px,.4cqw) max(8px,1cqw)}

  .is-open .pl .nm{line-height:1.1}
}
/* 縦型（?layout=v・9:16。kit の KKit.view が body.vert を付ける）: 並べ方だけ。帯・お題の札は横いっぱいに上下に並べ、人の札は1列。
   字の下限は kit の --k-v-min（窓の幅の 3.9%・1080 幅で 42px・405 幅で約16px）。42px 固定の下限はやめた（405x720 の別窓ではみ出す） */
body.vert .q{font-size:max(var(--k-v-min),calc(6.6cqw*var(--f,1)))}

body.vert .pl .nm{flex:1 1 auto;min-width:0}
body.vert .pl .nm{font-size:max(var(--k-v-min),calc(5cqw*var(--f,1)))}
body.vert .pl .st,body.vert .pl .an{flex:none;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:max(var(--k-v-min),calc(5cqw*var(--f,1)))!important}

body.vert .qrow{flex-wrap:wrap}
body.vert .verdict{min-height:0}
body.vert .verdict .k-stamp{width:max(70px,14cqw);height:max(70px,14cqw)}
body.vert .res{flex-direction:column;align-items:stretch;gap:max(10px,3cqw)}

body.vert .bd,body.vert .bd.tr,body.vert .bd.br,body.vert .bd.b,body.vert .tp,body.vert .tp.wide{position:relative;left:auto;right:auto;top:auto;bottom:auto;width:auto;max-height:none;transform:none}

body.vert .bd .ct b{font-size:max(var(--k-v-min),calc(16cqw*var(--f,1)))}

body.vert .ky-band[data-pos="br"] .bd,body.vert .ky-band[data-pos="b"] .bd{order:2;margin-top:auto}
body.vert #tst{left:3cqw!important;right:3cqw!important;top:42%!important;bottom:auto!important;transform:none!important;max-width:none}

<body class="k-view">
<div class="k-view-stage" id="stage">
  <header class="k-view-top"><span class="ky-ttl" id="ttl">みんなの共通点探し</span><span class="ky-meta" id="meta"></span></header>
  <main class="k-view-body" id="main"></main>
  <div id="tst" hidden></div>
  <div id="cel" hidden></div>
  <div id="stp" hidden></div>
  <div class="k-view-idle" id="idle"><b>みんなの共通点探し</b><p>まもなく始まります</p><small>操作ページで始めると、ここに出ます</small></div>
  <footer class="k-view-credit">共通点探しゲーム｜kyoutsu.kkpwebninja.com</footer>
</div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function san(n){ n = String(n || ''); return /(さん|様|くん|君|ちゃん|氏)$/.test(n) ? n : n + 'さん'; }
  var V = KKit.view({ ch: 'ky-view' });
  function reveal(el, cls){ if (el && KKit.reveal) { el.classList.add(cls || 'k-reveal-stamp'); KKit.reveal(el); } }
  var lastStamp = null, lastTs = null, lastCel = null, stT = 0, tsT = 0, celT = 0, cdT = 0, lastStep = '', cur = null, first = true;
  function cols(n){ return 'grid-template-columns:repeat(' + (n >= 5 ? 3 : n) + ',minmax(0,1fr))'; }
  // 答えの大きさ（幅1600で 104/84/70/58px）。小さいウィンドウでも 42px（縦型は kit の --k-v-min＝窓の幅の比）より小さくしない。--f は KKit.view.fit が下げる
  function anSize(n){ return 'max(' + (document.documentElement.getAttribute('data-k-layout') === 'v' ? 'var(--k-v-min)' : '42px') + ',calc(' + (n <= 2 ? 6.5 : n === 3 ? 5.25 : n === 4 ? 4.4 : 3.6) + 'cqw * var(--f,1)))'; }
  function stamp(hit){ return '<span class="k-stamp' + (hit ? '' : ' k-stamp-sumi') + '" id="vst">' + (hit ? '共通<br>点！' : 'ズレ<br>た！') + '</span>'; }
  function band(s){
    // 見せるのは新しい3つだけ（字を大きく・2行まで）。全部はまとめで出す
    // 小さいウィンドウと下の帯は新しい2つ（横に3つ・字が42pxで止まると1つが細くなる）
    var it = s.items || [], k = it.length, goal = s.goal || 5, pos = s.pos || 'tr', nShow = (pos === 'b' || $('stage').clientWidth <= 1100) ? 2 : 3, show = it.slice(-nShow), more = k - show.length;
    var h = '<div class="bd ' + pos + '" id="bd"><div class="ct"><small>共通点</small><b>' + k + '</b>' + (k >= goal ? '<i>個</i><span class="ok">目標' + goal + '個 達成</span>' : '<i>/ ' + goal + '</i>') + '</div>';
    h += '<ol>' + show.map(function(t, j){ return '<li data-n="' + (more + j + 1) + '"><span>' + esc(t) + '</span></li>'; }).join('') + '</ol>';
    if (more && pos !== 'b') h += '<div class="more">ほか ' + more + '個</div>';
    if (!k) h += '<div class="hint">何個見つかると思う？コメントで予想してね</div>';
    return h + '</div>';
  }
  // 話の途中の「お題で1問」：帯の横の札に出す（画面ぜんぶを覆わない。答えは全員そろってから出す）
  function onePanel(s){
    var o = s.one, h = '<div class="tp one' + (s.pos === 'b' ? ' wide' : '') + '"><small>お題で1問</small><div class="q">' + esc(o.q) + '</div>';
    if (o.missing) {
      h += '<div class="ch">' + (o.c || []).map(function(c){ return '<span>' + esc(c) + '</span>'; }).join('') + '</div><div class="say">せーので答えてね</div>';
    } else {
      var hs = {}; (o.hit || []).forEach(function(g){ g.forEach(function(i){ hs[i] = 1; }); });
      h += '<ul class="ans' + ((s.names || []).length >= 4 ? ' many' : '') + '">' + (s.names || []).map(function(n, i){ return '<li class="' + (hs[i] ? 'hit' : '') + '"><span class="n">' + esc(san(n)) + '</span><span class="a">' + esc(o.ans[i] || '') + '</span></li>'; }).join('') + '</ul>';
      h += '<div class="vd">' + stamp(!!o.all) + '<span>' + (o.rare ? '<span class="rare">レア！</span>' : '') + esc(o.verdict || '') + '</span></div>';
    }
    return h + '</div>';
  }
  function setTitle(t){ var e = $('ttl'); if (e.textContent !== t) { e.textContent = t; KKit.fitText(e, { min: 42 }); } }
  function render(s){
    cur = s;
    if (cdT && cdT.stop) { cdT.stop(); cdT = 0; }
    var tt = (s && s.title) || 'みんなの共通点探し';
    if (!s || !s.step) { V.idle(true, tt); $('stage').classList.remove('ky-band'); return; }
    // せーので オープン：3・2・1 は kit の k-countdown（操作ページと同じ）
    if (s.step === 'cd') { if (KKit.countdown) cdT = KKit.countdown(3, { step: 650 }); return; }
    V.idle(false);
    setTitle(tt);
    var m = $('main'), meta = $('meta'), st = $('stage'), h = '';
    var isBand = s.step === 'talk' || (s.step === 'setup' && s.mode !== 'odai');
    st.classList.toggle('ky-band', isBand); st.setAttribute('data-pos', s.pos || 'tr');
    if (s.step !== 'talk') $('tst').hidden = true;
    if (s.step === 'setup' && isBand) {
      // 始める前から帯の形で出す（OBSの位置合わせ・クロマキーを本番と同じ形で試せる）
      meta.innerHTML = '';
      h = band({ items: [], goal: s.goal, pos: s.pos });
    } else if (s.step === 'setup') {
      meta.innerHTML = '';
      var nm = esc((s.names || []).map(san).join(' × '));
      h = '<p class="big">共通点はいくつ？</p><p class="names" id="vNames">' + nm + '</p><p class="ask">コメントで予想してね：<b>' + ((s.n || 2) === 2 ? '2人の共通点は何個？' : '共通点が見つかるのは何問？') + '</b></p>';
    } else if (s.step === 'talk') {
      meta.innerHTML = '';
      h = band(s);
      if (s.one) h += onePanel(s);
      else if (s.topic) h += '<div class="tp' + (s.pos === 'b' ? ' wide' : '') + '"><small>お題</small><div class="q">' + esc(s.topic.q) + '</div><div class="f">' + esc(s.topic.f) + '</div></div>';
    } else if (s.step === 'q' || s.step === 'open') {
      meta.innerHTML = '<span class="band-l' + (s.step === 'open' ? ' on' : '') + '">' + (s.step === 'q' ? '答える' : 'オープン') + '</span><span>' + (s.one ? 'お題' : '第' + s.qn + '問<span class="qn-all"> / ' + s.total + '</span>') + '</span>';
      // 小さいウィンドウのオープンは、判子を問いの横に（判定の文は札の赤いふちで見える）
      var small = $('stage').clientWidth <= 1100, hit0 = (s.hit || []).length > 0, qrow = small && s.step === 'open' && !s.missing;
      h = '<div class="pack">' + esc(s.pack || '') + '</div>' + (qrow ? '<div class="qrow">' : '') + '<div class="q' + (s.step === 'open' ? ' sm' : '') + '" id="vQ">' + esc(s.q) + '</div>'
        + (qrow ? '<div class="verdict">' + (s.rare ? '<span class="rare">レア！</span>' : '') + stamp(hit0) + '</div></div>' : '');
      if (s.step === 'q') {
        h += '<div class="choices">' + (s.c || []).map(function(c){ return '<span class="k-tag">' + esc(c) + '</span>'; }).join('') + '</div>';
        h += '<div class="players" style="' + cols(s.names.length) + '">';
        s.names.forEach(function(n, i){ h += '<div class="pl k-paper' + (s.done[i] ? ' done' : '') + '"><span class="nm">' + esc(san(n)) + '</span><span class="st">' + (s.done[i] ? (s.uke[i] ? '受付 ' + esc(s.uke[i]) : '答えた') : '考え中') + '</span></div>'; });
        h += '</div>';
        if (s.h) h += '<p class="ask"><b>コメントで、あなたは何派？</b></p>';
        else if (s.qn === 1 && !s.one) h += '<p class="ask">コメントで予想してね：<b>' + (s.n === 2 ? '2人の共通点は何個？' : '共通点が見つかるのは何問？') + '</b></p>';
      } else {
        var hs = {}; (s.hit || []).forEach(function(g){ g.forEach(function(i){ hs[i] = 1; }); });
        var fs = anSize(s.names.length);
        h += '<div class="players open" style="' + cols(s.names.length) + '">';
        s.names.forEach(function(n, i){ h += '<div class="pl k-paper' + (hs[i] ? ' hit' : '') + '"><span class="nm">' + esc(san(n)) + '</span><span class="an" style="font-size:' + fs + '">' + esc(s.ans[i] || '…') + '</span></div>'; });
        h += '</div>';
        if (!s.missing && !qrow) {
          var hit = (s.hit || []).length > 0;
          h += '<div class="verdict">' + stamp(hit) + (s.rare ? '<span class="rare">レア！</span>' : '') + '<span class="tx">' + esc(s.verdict || '') + '</span></div>';
          h += s.h ? '<div class="follow"><b style="color:var(--k-shu)">コメントで、あなたは何派？</b></div>' : '<div class="follow"><span>聞いてみよう</span>' + esc(s.follow || '') + '</div>';
        }
      }
    } else if (s.step === 'result') {
      meta.innerHTML = '<span class="band-l on">まとめ</span>';
      if (s.mode === 'talk') {
        var it = s.items || [];
        h = '<div class="res"><div class="k-result"><small>見つけた共通点</small><b class="k-num">' + it.length + '個</b><small>目標 ' + (s.goal || 5) + '個</small></div><ul id="vList">' + (it.slice(0, 8).map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') || '<li>こんどは見つからなかった</li>') + (it.length > 8 ? '<li>ほか ' + (it.length - 8) + '個</li>' : '') + '</ul></div>';
      } else {
        var b = s.best;
        h = '<div class="res"><div class="k-result"><small>' + (s.n === 2 ? esc(san(s.names[0])) + 'と' + esc(san(s.names[1])) + 'の共通点' : 'みんなの共通点') + '</small><b class="k-num">' + s.hits + '個</b><small>' + s.total + '問中</small></div>'
          + '<div class="best"><small>いちばんレアな共通点</small>' + (b ? '<b>' + esc(b.a) + '</b><span>' + esc(b.q) + (b.who ? '　' + esc(b.who) : '') + '</span>' : '<b>全部ズレた</b><span>ズレた話も、それはそれで。</span>') + '</div></div>';
      }
    }
    var stepKey = s.step + '|' + s.qn + '|' + (s.hit || []).length + '|' + !!s.missing + '|' + (s.one ? s.one.q + !!s.one.missing : '');
    m.innerHTML = h;
    m.className = 'k-view-body' + ((s.names || []).length >= 5 ? ' n5' : '') + (s.step === 'open' ? ' is-open' : s.step === 'q' ? ' is-q' : '');
    fitAll();
    if (stepKey !== lastStep) { reveal($('vst')); reveal(m.querySelector('.res .k-result'), 'k-reveal'); }
    lastStep = stepKey;
    // 話しながら探す：足した瞬間の判子（帯の横に2.6秒）
    if (s.step === 'talk' && s.stamp && s.stamp.id !== lastTs) {
      lastTs = s.stamp.id;
      var ts = $('tst'), pos = s.pos || 'tr';
      ts.innerHTML = '<span class="k-stamp">共通<br>点！</span><span class="t">' + esc(s.stamp.t) + '</span>';
      ts.style.cssText = pos === 'b' ? 'left:50%;bottom:calc(var(--k-v-credit)*1.6 + 2cqw + var(--ky-bbh,14cqw));transform:translateX(-50%)' : (pos === 'br' ? 'right:48cqw;bottom:calc(var(--k-v-credit)*1.6 + 2.5cqw)' : 'right:48cqw;top:2.5cqw');
      ts.hidden = false; reveal(ts.querySelector('.k-stamp'));
      clearTimeout(tsT); tsT = setTimeout(function(){ ts.hidden = true; }, 2600);
    }
    // 目標に届いたとき（1回だけ）
    if (s.step === 'talk' && s.cel && s.cel !== lastCel) {
      lastCel = s.cel;
      var c = $('cel'); c.className = (s.pos || 'tr') === 'b' ? 'at-b' : ''; c.innerHTML = '<div class="k-result"><small>共通点</small><b>' + (s.goal || 5) + '個そろった！</b><small>' + esc((s.names || []).map(san).join(' × ')) + '</small></div>';
      c.hidden = false; reveal(c.querySelector('.k-result'), 'k-reveal');
      clearTimeout(celT); celT = setTimeout(function(){ c.hidden = true; }, 3800);
    }
    // 回答コードを受け取ったときのハンコ（名前と受付記号だけ。答えは出さない）
    if (s.stamp && s.stamp.u && s.stamp.id !== lastStamp) {
      lastStamp = s.stamp.id;
      var sp = $('stp'); sp.innerHTML = '<span class="mk">受</span><span>' + esc(s.stamp.n) + '　受け取りました　<span class="uk">受付 ' + esc(s.stamp.u) + '</span></span>';
      sp.hidden = false; clearTimeout(stT); stT = setTimeout(function(){ sp.hidden = true; }, 2600);
    }
  }
  // 1画面に収める（kit の KKit.view.fit）: 大きな字の --f を下げ、それでも入らなければ補助の行から外す（コメントの呼びかけ → お題の種類 → 掘り下げ → 選ぶ答え → 帯の案内・お題の補足）
  var DROP = ['.ask', '.pack', '.follow', '.bd .hint', '.tp .f', '.choices', '.tp .ch', '.bd .more', '.verdict .tx', '.res .best span', '.verdict'];
  function fitAll(){ V.fit($('main'), { min: 0.6, x: true, drop: DROP, after: fitNow }); }
  // 字を収める（1/3 で14px＝42px より小さくしない）。下の帯の高さを札と判子の位置に使う
  function fitNow(){
    KKit.fitText($('ttl'), { min: 42 });
    var q = $('vQ'); if (q) KKit.fitText(q, { min: 42, lines: 2 });
    var nm = $('vNames'); if (nm) KKit.fitText(nm, { min: 42 });
    var bd = $('bd'), st = $('stage');
    if (bd && bd.classList.contains('b')) st.style.setProperty('--ky-bbh', (bd.offsetHeight + 12) + 'px'); else st.style.removeProperty('--ky-bbh');
  }
  // 字のデータが後から届いた・窓の大きさが変わった：収め直す（小さい窓との境目をまたいだら組み直す）。kit の KKit.view.refit
  KKit.view.refit(function(){ if (cur && cur.step !== 'cd') render(cur); else fitNow(); });   // 外した行を戻して組み直す（小さい窓との境目をまたいでも組み直せる）
  window.__kyRender = render;
  // 開き直したとき：いまの場面だけ出す（判子・そろった演出は出し直さない）
  KKit.live({ ch: 'ky-view', role: 'view', onState: function(s){
    if (first) { first = false; if (s && s.stamp) lastTs = lastStamp = s.stamp.id; if (s && s.cel) lastCel = s.cel; if (s && s.step === 'cd') return; }
    render(s);
  } }).start();
})();
</script>
</body>
</html>
