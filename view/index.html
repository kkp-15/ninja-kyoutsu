<!-- OBS 表示ページ。広告・GA4 なし。操作ページ（同じブラウザ）から BroadcastChannel で今の場面だけ受け取る。
     1600x900 で組んだ舞台を、ウィンドウに合わせて縮める（どのサイズでもスクロールなし）。 -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:var(--k-kinari)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0;box-sizing:border-box;padding:40px 56px;display:flex;flex-direction:column;background:var(--k-kinari) url(/kit/img/d4-washi.webp) 0 0/420px auto;font-family:var(--k-body);color:var(--k-sumi)}
.top{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:16px;border-bottom:4px solid var(--k-sumi)}
.top .ttl{font-family:var(--k-brush);font-size:44px;letter-spacing:.14em}
.top .meta{display:flex;align-items:center;gap:28px;font-family:var(--k-bold);font-size:38px}
.top .meta b{color:var(--k-shu);font-size:52px;font-variant-numeric:tabular-nums}
.band{display:inline-block;margin-right:16px;padding:4px 20px;background:var(--k-sumi);color:#fff;font-family:var(--k-bold);font-size:30px;transform:skewX(-8deg)}
.main{flex:1;display:flex;flex-direction:column;min-height:0;padding-top:12px}
.q{font-family:var(--k-bold);font-size:76px;line-height:1.2;letter-spacing:.03em;word-break:auto-phrase;text-wrap:balance}
.q.sm{font-size:52px}
.pack{font-size:30px;font-weight:800;color:var(--k-text-2);margin-bottom:6px}
.choices{display:flex;flex-wrap:wrap;gap:16px;margin-top:28px}
.choices span{padding:10px 26px;border:3px solid var(--k-sumi);border-radius:8px;background:#fff;font-size:42px;font-weight:800}
.free{margin-top:28px;font-size:40px;font-weight:800;color:var(--k-text-2)}
.players{display:grid;gap:16px;margin-top:auto}
.pl{position:relative;padding:14px 18px;border:3px solid var(--k-sumi);border-radius:8px;background:#fff;min-width:0}
.pl .nm{display:block;font-size:34px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .st{display:block;font-family:var(--k-bold);font-size:34px;color:var(--k-text-2)}
.pl.done .st{color:var(--k-shu)}
.pl .an{display:block;font-family:var(--k-bold);font-size:56px;line-height:1.15;word-break:auto-phrase}
.pl.hit{border-color:var(--k-shu);border-width:6px;padding:11px 15px}
.pl.hit .an{color:var(--k-shu)}
.verdict{display:flex;align-items:center;gap:28px;margin-top:20px;font-size:42px;line-height:1.3;font-weight:800;min-height:116px}
.verdict .k-stamp{flex:0 0 auto;width:116px;height:116px;font-size:36px;line-height:1.05;text-align:center}
.verdict.miss{color:var(--k-text-2)}
.ask{margin-top:24px;padding:16px 0;border-top:2px solid var(--k-line-soft);font-size:40px;font-weight:800}
.ask b{color:var(--k-shu)}
.big{font-family:var(--k-brush);font-size:110px;letter-spacing:.14em;line-height:1.1;margin-top:20px}
.names{margin-top:28px;font-family:var(--k-bold);font-size:56px;line-height:1.3}
.res{display:flex;gap:48px;align-items:flex-start;flex:1;min-height:0}
.res .k-result{flex:0 0 640px}
.res .k-result small{font-size:30px}
.res .k-result b{font-size:96px}
.res ul{flex:1;margin:0;padding:0;list-style:none;font-size:38px;font-weight:800;line-height:1.35;min-width:0}
.res li{padding:10px 0;border-bottom:2px solid var(--k-line-soft);overflow:hidden}
.res li small{display:block;font-size:28px;color:var(--k-text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res li b{color:var(--k-shu);flex:0 0 auto}
.res .rw{display:flex;justify-content:space-between;gap:16px}.res .rw>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .k-result b.pair{font-size:52px;line-height:1.2;word-break:break-all}
.players.many .an{font-size:42px}.players.many .pl{padding:10px 14px}.players.many .pl.hit{padding:7px 11px}
#cd{position:absolute;inset:0;display:grid;place-items:center;background:rgba(251,243,228,.92);font-family:var(--k-bold);font-size:300px;color:var(--k-shu);text-shadow:var(--k-outline)}
#stp{position:absolute;right:56px;top:140px;display:flex;align-items:center;gap:20px;padding:18px 28px;border:4px solid var(--k-shu);border-radius:8px;background:#fff;font-size:40px;font-weight:800;transform:rotate(-2deg)}
#stp .mk{display:grid;place-items:center;width:80px;height:80px;background:url(/kit/img/d4-hanko.webp) center/100% 100% no-repeat;font-family:var(--k-brush);font-size:40px;color:var(--k-shu)}
#stp .uk{color:var(--k-shu);font-family:var(--k-bold)}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <div class="top"><span class="ttl">共通点探し</span><span class="meta" id="meta"></span></div>
  <div class="main" id="main"><p class="big">共通点探し</p><p class="ask">操作ページ（同じブラウザ）で配信モードにすると、ここに場面が出ます。</p></div>
  <div id="cd" hidden></div>
  <div id="stp" hidden></div>
</div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function san(n){ n = String(n || ''); return /(さん|様|くん|君|ちゃん|氏)$/.test(n) ? n : n + 'さん'; }
  function fit(){ var s = $('stage'), z = Math.min(innerWidth / 1600, innerHeight / 900); s.style.transform = 'scale(' + z + ') translate(-50%,-50%)'; }
  window.addEventListener('resize', fit); fit();
  var lastStamp = null, stT = 0, cdT = 0, lastStep = '';
  function cols(n){ return 'grid-template-columns:repeat(' + (n >= 5 ? 3 : n) + ',minmax(0,1fr))'; }
  function render(s){
    if (!s || !s.step) return;
    var m = $('main'), meta = $('meta'), h = '';
    $('cd').hidden = s.step !== 'cd'; clearTimeout(cdT);
    if (s.step === 'cd') { var k = 3; var tick = function(){ $('cd').textContent = k; if (k-- > 1) cdT = setTimeout(tick, 650); }; tick(); return; }
    if (s.step === 'setup') {
      meta.innerHTML = '';
      h = '<p class="big">共通点はいくつ？</p><p class="names">' + esc((s.names || []).map(san).join(' × ')) + '</p>'
        + '<p class="ask">コメントで予想してね：<b>' + ((s.n || 2) === 2 ? '2人の共通点は何個？' : '共通点が見つかるのは何問？') + '</b></p>';
    } else if (s.step === 'q' || s.step === 'open') {
      meta.innerHTML = '<span><span class="band">' + (s.step === 'q' ? '答える' : 'オープン') + '</span>第' + s.qn + '問 / ' + s.total + '</span><span>共通点 <b>' + s.hits + '</b></span>';
      h = '<div class="pack">' + esc(s.pack || '') + (s.c ? '' : '・自由に答える') + '</div><div class="q' + (s.step === 'open' ? ' sm' : '') + '">' + esc(s.q) + '</div>';
      if (s.step === 'q') {
        h += s.c ? '<div class="choices">' + s.c.map(function(c){ return '<span>' + esc(c) + '</span>'; }).join('') + '</div>' : '<div class="free">自由に答えるお題。オープンの合図で一斉に言ってね</div>';
        if (s.qn === 1) h += '<p class="ask">コメントで予想してね：<b>' + (s.n === 2 ? '2人の共通点は何個？' : '共通点が見つかるのは何問？') + '</b></p>';
      }
      var hitSet = {}; (s.groups || []).forEach(function(g){ g.m.forEach(function(i){ hitSet[i] = 1; }); });
      h += '<div class="players' + (s.names.length >= 5 ? ' many' : '') + '" style="' + cols(s.names.length) + '">';
      s.names.forEach(function(n, i){
        if (s.step === 'q') h += '<div class="pl' + (s.done[i] ? ' done' : '') + '"><span class="nm">' + esc(san(n)) + '</span><span class="st">' + (s.done[i] ? (s.uke[i] ? '受付 ' + esc(s.uke[i]) : '答えた') : '考え中') + '</span></div>';
        else h += '<div class="pl' + (hitSet[i] ? ' hit' : '') + '"><span class="nm">' + esc(san(n)) + '</span><span class="an">' + esc(s.ans[i] || '…') + '</span></div>';
      });
      h += '</div>';
      if (s.step === 'open') {
        h += (s.groups && s.groups.length)
          ? '<div class="verdict"><span class="k-stamp" id="vst">共通<br>点</span><span>' + esc(s.groups.map(function(g){ return '「' + g.l + '」' + (s.names.length > 2 ? g.m.length + '人' : ''); }).join('　')) + 'で同じ！</span></div>'
          : '<div class="verdict miss">こんどは共通点なし</div>';
      }
    } else if (s.step === 'result') {
      meta.innerHTML = '<span><span class="band">結果</span>' + s.total + '問</span>';
      var p = s.pairs || [], top = p[0] || { a: '', b: '', k: 0, l: [] };
      h = '<div class="res"><div class="k-result"><small>' + (s.n === 2 ? esc(san(top.a)) + 'と' + esc(san(top.b)) + 'の共通点' : 'いちばん多かったペア') + '</small><b' + (s.n === 2 ? '' : ' class="pair"') + '>' + (s.n === 2 ? top.k + '個' : esc(san(top.a)) + '<br>と<br>' + esc(san(top.b))) + '</b><small>' + (s.n === 2 ? s.total + '問中' : top.k + '個 / ' + s.total + '問中') + '</small></div><ul>';
      if (s.n === 2) h += top.l.slice(0, 8).map(function(l){ return '<li>' + esc(l) + '</li>'; }).join('') || '<li>こんどは共通点なし。ズレっぷりもまた相性</li>';
      else { h += p.slice(0, 6).map(function(x){ return '<li><span class="rw"><span>' + esc(san(x.a)) + 'と' + esc(san(x.b)) + '</span><b>' + x.k + '個</b></span><small>' + esc(x.l.join('・')) + '</small></li>'; }).join(''); if (s.all && s.all.length) h += '<li><span class="rw"><span>全員一致</span><b>' + s.all.length + '個</b></span><small>' + esc(s.all.join('・')) + '</small></li>'; }
      h += '</ul></div>';
    }
    var stepKey = s.step + '|' + s.qn + '|' + ((s.groups || []).length);
    m.innerHTML = h;
    if (stepKey !== lastStep) { var vs = $('vst'); if (vs && window.KKit && KKit.reveal) { vs.classList.add('k-reveal-stamp'); KKit.reveal(vs); } var rs = m.querySelector('.k-result'); if (rs && window.KKit && KKit.reveal) { rs.classList.add('k-reveal'); KKit.reveal(rs); } }
    lastStep = stepKey;
    // 回答コードを受け取ったときのハンコ（名前と受付記号だけ。答えは出さない）
    if (s.stamp && s.stamp.id !== lastStamp) {
      lastStamp = s.stamp.id;
      var st = $('stp'); st.innerHTML = '<span class="mk">受</span><span>' + esc(s.stamp.n) + '　受け取りました　<span class="uk">受付 ' + esc(s.stamp.u) + '</span></span>';
      st.hidden = false; clearTimeout(stT); stT = setTimeout(function(){ st.hidden = true; }, 2600);
    }
  }
  window.__kyRender = render;
  try { var ch = new BroadcastChannel('ky-view'); ch.onmessage = function(e){ render(e.data); }; } catch (e) {}
  window.addEventListener('storage', function(e){ if (e.key === 'ky-view-state') { try { render(JSON.parse(e.newValue)); } catch (_) {} } });
  try { var s0 = JSON.parse(localStorage.getItem('ky-view-state') || 'null'); if (s0 && s0.step !== 'cd') render(s0); } catch (e) {}
})();
</script>
</body>
</html>
